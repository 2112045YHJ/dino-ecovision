services:
  # 1. MySQL 데이터베이스 서비스
  db:
    image: mysql:8.0
    container_name: dino-mysql
    restart: always
    environment:
      MYSQL_DATABASE: dino_ecovision
      MYSQL_ROOT_PASSWORD: "1111"
    ports:
      - "3306:3306"
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1_schema.sql
      - ./database/data.sql:/docker-entrypoint-initdb.d/2_data.sql
      - mysql-data:/var/lib/mysql
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

  # 2. Redis 캐시 서비스
  redis:
    image: redis:7.0-alpine
    container_name: dino-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  # 3. 백엔드 Spring Boot 서비스
  backend:
    build: ./backend
    container_name: dino-backend
    restart: always
    depends_on:
      - db
      - redis
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/dino_ecovision?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "1111"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_FLYWAY_BASELINE_VERSION: "1"
    ports:
      - "8080:8080"

  # 4. 프론트엔드 Nginx 서비스
  frontend:
    image: nginx:stable-alpine
    container_name: dino-frontend
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend

volumes:
  mysql-data:
  redis-data:
