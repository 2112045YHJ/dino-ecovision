# Server Configuration
server.port=8080

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/dino_ecovision?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1111
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Redis (Refresh Token)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# JWT Configuration (Secret Key - HS256 requires at least 256 bits of key)
jwt.secret=your-very-long-secret-key-for-jwt-signing-which-should-be-at-least-256-bits-long
jwt.expiration-ms=3600000
jwt.refresh-expiration-ms=2592000000
